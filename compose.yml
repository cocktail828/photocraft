services:
  photocraft:
    image: photocraft:local
    build:
      context: .
      args:
        VCS_REF: ${PHOTOCRAFT_COMMIT:-}
        VERSION_TAG: ${PHOTOCRAFT_TAG:-}
    ports:
      - "${PHOTOCRAFT_BIND_IP:-127.0.0.1}:8000:8000"
    volumes:
      - photocraft-config:/data
      - type: bind
        source: ${PHOTOCRAFT_FONTS_DIR:-/usr/share/fonts}
        target: /usr/local/share/fonts
        read_only: true
        bind:
          create_host_path: false
    environment:
      PHOTOCRAFT_MAX_UPLOAD_MB: "40"
      PHOTOCRAFT_MAX_PIXELS: "24000000"
      PHOTOCRAFT_MAX_SESSIONS: "4"
      PHOTOCRAFT_SESSION_TTL: "900"
      PHOTOCRAFT_HISTORY_MB: "128"
    restart: unless-stopped
    init: true
    mem_limit: 2g
volumes:
  photocraft-config:
