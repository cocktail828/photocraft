name: Container release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: python -m pytest -q
      - name: Build image with Git identity
        shell: bash
        run: |
          release_tag=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then release_tag="$GITHUB_REF_NAME"; fi
          docker build --build-arg VCS_REF="$GITHUB_SHA" --build-arg VERSION_TAG="$release_tag" --tag photocraft:release .
      - name: Start and verify image
        run: |
          docker run -d --name photocraft-release -p 127.0.0.1:8000:8000 photocraft:release
          python scripts/smoke_web.py --url http://127.0.0.1:8000
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify browser UI
        env:
          PHOTOCRAFT_BASE_URL: http://127.0.0.1:8000
          PHOTOCRAFT_SCREENSHOT_DIR: artifacts/web-ui
        run: npm run test:web
      - name: Publish verified image to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag photocraft:release "$image:$GITHUB_REF_NAME"
          docker tag photocraft:release "$image:sha-${GITHUB_SHA:0:12}"
          docker push "$image:$GITHUB_REF_NAME"
          docker push "$image:sha-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            docker tag photocraft:release "$image:latest"
            docker push "$image:latest"
          fi
          echo "Image: \`$image:$GITHUB_REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: web-ui
          path: artifacts/web-ui
          if-no-files-found: ignore
      - name: Container logs
        if: always()
        run: docker logs photocraft-release
      - name: Stop container
        if: always()
        run: docker rm -f -v photocraft-release
