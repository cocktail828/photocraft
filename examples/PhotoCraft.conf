# PhotoCraft 配置（UTF-8 TOML）。由部署管理员编辑，修改后重启服务生效。
# 每个 [[crop.templates]] 块对应一个下拉模板，可直接修改或删除。
# 仅保留自由裁剪与按比例裁剪：将 [crop] 下的 templates 设为 []。
# 模板锁定输出像素 width_px / height_px；图像压缩仅设置格式、画质与编码选项。
# watermark.color：默认水印颜色；colors.custom：16 个预定义颜色（#RRGGBB）。

[appearance]
theme = "light"

[watermark]
color = "#64748b"

[colors]
custom = ["#000000", "#ffffff", "#64748b", "#ef4444", "#f97316", "#f59e0b", "#eab308", "#84cc16", "#22c55e", "#14b8a6", "#06b6d4", "#3b82f6", "#6366f1", "#8b5cf6", "#d946ef", "#ec4899"]

[crop]

[[crop.templates]]
name = "1 寸证件照 · 295 × 413 px"
width_px = 295
height_px = 413
width_mm = 25
height_mm = 35
dpi = 300
format = "JPEG"
background = "#ffffff"

[[crop.templates]]
name = "2 寸证件照 · 413 × 579 px"
width_px = 413
height_px = 579
width_mm = 35
height_mm = 49
dpi = 300
format = "JPEG"
background = "#ffffff"

# 教资参考尺寸来自北京教育考试院历史公告；当次要求以报考地公告为准。
# 通常要求白底、JPG/JPEG、不超过 200KB；裁剪不会自动保证格式和体积。
[[crop.templates]]
name = "教师资格考试（参考）· 150 × 200 px"
width_px = 150
height_px = 200
width_mm = 12.7
height_mm = 16.93
dpi = 300
format = "JPEG"
background = "#ffffff"

# 国考源照片最低像素要求；裁剪后仍需使用官方照片处理工具。
# 省考要求可能不同，应核对当地当次公告。
[[crop.templates]]
name = "国家公务员考试（参考）· 295 × 413 px"
width_px = 295
height_px = 413
width_mm = 25
height_mm = 35
dpi = 300
format = "JPEG"
background = "#ffffff"
